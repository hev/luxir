# Generated by make-workflow.py; edit bench.py and regenerate.
name: Luxir MAIN vs CANDIDATE
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Runner (Oven uses persistent local caches)
        type: choice
        options: [ubuntu-24.04, oven-luxir]
        default: ubuntu-24.04
      base_repo:
        description: Public base repository
        default: luxir-search/luxir
        required: true
        type: string
      base_ref:
        description: Base ref (pinned experiment 89dbd3d40f56452e6ae6da6216f7dccc09e52541)
        default: main
        required: true
        type: string
      candidate_repo:
        description: Public candidate repository
        default: synhershko/luxir
        required: true
        type: string
      candidate_ref:
        description: Candidate ref (pinned experiment a7ba8db063060f25d9c34f31c9d98899fc26ed11)
        default: pq4-fast-scan
        required: true
        type: string
      candidate_field_settings:
        description: Candidate-only vector field settings JSON (empty object disables feature)
        default: '{"ann":{"codec":"pq4"}}'
        required: false
        type: string
permissions:
  contents: read
  packages: read
jobs:
  x86:
    runs-on: ${{ inputs.runner == 'oven-luxir' && fromJSON('["self-hosted","linux","x64","oven-luxir"]') || fromJSON('["ubuntu-24.04"]') }}
    env:
      DOCKER_CONFIG: /tmp/luxir-bench-docker-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 180
    outputs:
      source-sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Select Oven rootless Docker endpoint
        if: inputs.runner == 'oven-luxir'
        run: |
          if [[ -z ${DOCKER_HOST:-} && -S /run/user/$(id -u)/docker.sock ]]; then
            echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"
          fi
      - name: Require public sources
        env:
          BASE_REPO: ${{ inputs.base_repo }}
          CANDIDATE_REPO: ${{ inputs.candidate_repo }}
        run: |
          set -euo pipefail
          for repo in "$BASE_REPO" "$CANDIDATE_REPO"; do
            curl --fail --silent --show-error "https://api.github.com/repos/$repo" | python3 -c 'import json,sys; assert json.load(sys.stdin)["private"] is False'
          done
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.base_repo }}
          ref: ${{ inputs.base_ref }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repo }}
          ref: ${{ inputs.candidate_ref }}
          path: candidate
          persist-credentials: false
      - name: Record sources
        id: source
        run: |
          mkdir -p evidence
          git -C base rev-parse HEAD | tee evidence/base-revision.txt
          git -C candidate rev-parse HEAD | tee evidence/candidate-revision.txt
          echo "sha=$(git -C candidate rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          lscpu > evidence/lscpu.txt
          echo "jobs=$(cd candidate && ./tools/build-jobs 3000)" >> "$GITHUB_OUTPUT"
      - name: Write reviewed dependency key helper
        run: |
          cat > "$RUNNER_TEMP/luxir-deps-key.py" <<'DEPS_KEY'
          #!/usr/bin/env python3
          """Hash the effective normal-dependencies build inputs; emit one SHA-256 tag."""
          import hashlib
          import re
          import sys
          from pathlib import Path


          def deps_key(root):
              root = Path(root)
              dockerfile = (root / '.devcontainer/Dockerfile').read_text()
              stage = dockerfile.split('FROM normal-dependencies AS dependencies\n')[0]
              if stage == dockerfile:
                  raise ValueError('Dockerfile stage boundary changed; review deps-key.py')
              copies = re.findall(r'^COPY (.+)$', stage, re.M)
              expected = [
                  '.devcontainer/check-toolchain.cpp .devcontainer/check-toolchain.sh /opt/luxir-checks/',
                  'deps/vcpkg.json deps/vcpkg-configuration.json /opt/luxir-deps/',
                  'deps/ports /opt/luxir-deps/ports',
                  'deps/triplets /opt/luxir-deps/triplets',
                  'test/blas_lapack_test.cpp /opt/luxir-checks/check-lapack.cpp',
              ]
              if 'COPY .devcontainer/check-lapack.cpp /opt/luxir-checks/' in stage:
                  expected[-1] = '.devcontainer/check-lapack.cpp /opt/luxir-checks/'
              if copies != expected or re.search(r'^(ADD|ONBUILD) ', stage, re.M):
                  raise ValueError('Dependency COPY/ADD contract changed; review deps-key.py')
              # BUILD_JOBS controls concurrency, not dependency identity.
              stage = re.sub(r'^ARG BUILD_JOBS=.*$', 'ARG BUILD_JOBS=<concurrency>', stage, flags=re.M)
              ignore = root / '.devcontainer/Dockerfile.dockerignore'
              text = ignore.read_text()
              # hev/luxir@4a27bd8: permit the LAPACK check excluded by upstream test/.
              if 'COPY test/blas_lapack_test.cpp ' in stage and '!test/blas_lapack_test.cpp' not in text.splitlines():
                  text = text.rstrip('\n') + '\n!test/\n!test/blas_lapack_test.cpp\n'
                  ignore.write_text(text)
              files = {'.devcontainer/Dockerfile': stage.encode(),
                       '.devcontainer/Dockerfile.dockerignore': text.encode()}
              for copy in expected:
                  for source in copy.split()[:-1]:
                      path = root / source
                      paths = sorted(path.rglob('*')) if path.is_dir() else [path]
                      for item in paths:
                          if item.is_symlink():
                              raise ValueError(f'Symlink input requires review: {item}')
                          if item.is_file():
                              files[item.relative_to(root).as_posix()] = item.read_bytes()
              digest = hashlib.sha256()
              for name, data in sorted(files.items()):
                  for value in (name.encode(), data):
                      digest.update(len(value).to_bytes(8, 'big'))
                      digest.update(value)
              return digest.hexdigest()


          if __name__ == '__main__':
              print(deps_key(sys.argv[1]))
          DEPS_KEY
      - name: Check prebuilt dependency images (never build vcpkg here)
        timeout-minutes: 4
        env:
          RUNNER_CHOICE: ${{ inputs.runner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for variant in base candidate; do
            key=$(python3 "$RUNNER_TEMP/luxir-deps-key.py" "$variant")
            echo "$key" > "evidence/$variant-deps-key.txt"
            image="ghcr.io/hev/luxir-deps:$key"
            # Check both manifests before downloading any large layers.
            if ! timeout 60 docker manifest inspect "$image" >/dev/null; then
              echo "::error::Missing $image. Run workflow luxir-deps-image.yml for $variant repo/ref (key $key), then rerun luxir-pq4-bench.yml."
              exit 1
            fi
          done
          if [[ "$RUNNER_CHOICE" == oven-luxir ]]; then
            cache="$HOME/.cache/luxir-pq4"
            mkdir -p "$cache/dataset"
            if [[ ! -e .pq4-dataset && ! -L .pq4-dataset ]]; then
              ln -s "$cache/dataset" .pq4-dataset
            fi
            [[ $(readlink -f .pq4-dataset) == "$cache/dataset" ]] || { echo "Unexpected existing dataset path" >&2; exit 1; }
          fi
      - name: Pull unique dependency images
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sort -u evidence/*-deps-key.txt | while read -r key; do
            image="ghcr.io/hev/luxir-deps:$key"
            # On Oven the Docker image store persists outside the workspace.
            docker image inspect "$image" >/dev/null 2>&1 || docker pull "$image"
          done
      - name: Cache dataset shards
        if: inputs.runner != 'oven-luxir'
        uses: actions/cache@v4
        with:
          path: |
            .pq4-dataset/*.parquet
            .pq4-dataset/dataset.json
          key: pq4-dbpedia-openai3-1536-100k-v1
      - name: Restore compiler objects
        id: ccache
        if: inputs.runner != 'oven-luxir'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/luxir/container-ccache
          key: pq4-ccache-${{ runner.arch }}-${{ hashFiles('evidence/*-deps-key.txt') }}-${{ steps.source.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            pq4-ccache-${{ runner.arch }}-${{ hashFiles('evidence/*-deps-key.txt') }}-
      - name: Build both revisions with shared ccache and record cold/warm durations
        env:
          LUXIR_BUILD_JOBS: ${{ steps.source.outputs.jobs }}
        run: |
          for variant in base candidate; do
            cd "$GITHUB_WORKSPACE"
            LUXIR_DEV_IMAGE="ghcr.io/hev/luxir-deps:$(cat "evidence/$variant-deps-key.txt")"
            export LUXIR_DEV_IMAGE
            cd "$GITHUB_WORKSPACE/$variant"
            git submodule update --init
            ./deps/fetch_sources.sh
            # Rootless container UID 0 maps to the owning host user, not host root.
            if docker info --format '{{json .SecurityOptions}}' | grep -q rootless; then
              # shellcheck disable=SC2016
              sed -i 's/--user "$(id -u):$(id -g)"/--user 0:0/' tools/dev-container
              grep -q -- '--user 0:0' tools/dev-container
              git diff -- tools/dev-container > "../evidence/$variant-rootless-helper.patch"
            fi
            ./tools/dev-container ccache --max-size 2G
            # shellcheck disable=SC2016
            /usr/bin/time -v -o "../evidence/$variant-cold-build-time.txt" bash -e -c '
              ./tools/dev-container cmake --preset container-release -DLUXIR_COMPILE_JOBS="$LUXIR_BUILD_JOBS"
              ./tools/dev-container cmake --build --preset container-release --target luxir
            '
            ./tools/dev-container cmake --build --preset container-release --target clean
            /usr/bin/time -v -o "../evidence/$variant-warm-build-time.txt" ./tools/dev-container cmake --build --preset container-release --target luxir
          done
      - name: Install harness dependencies
        run: |
          python3 -m venv .bench-venv
          .bench-venv/bin/pip install numpy==2.5.4 pyarrow==26.0.0 requests==2.34.2
      - name: Write self-contained harness
        run: |
          cat > "$RUNNER_TEMP/pq4-bench.py" <<'PYTHON_HARNESS'
          #!/usr/bin/env python3
          """Local-only interleaved MAIN/CANDIDATE comparison. Requires numpy, pyarrow, requests."""
          import argparse
          import copy
          from contextlib import ExitStack
          from types import SimpleNamespace
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import signal
          import socket
          import statistics
          import subprocess
          import time

          import numpy as np
          import pyarrow.parquet as pq
          import requests

          DATASET = 'Qdrant/dbpedia-entities-openai3-text-embedding-3-large-1536-100K'


          # Luxir has no listen-address flag. Restrict this owned process to loopback
          # without changing host firewall/services or the public source under test.
          LOOPBACK_BIND = r"""
          #define _GNU_SOURCE
          #include <arpa/inet.h>
          #include <dlfcn.h>
          #include <netinet/in.h>
          #include <string.h>
          #include <sys/socket.h>
          int bind(int fd, const struct sockaddr *addr, socklen_t len) {
              int (*next_bind)(int, const struct sockaddr *, socklen_t) = dlsym(RTLD_NEXT, "bind");
              struct sockaddr_storage copy;
              if (len <= sizeof(copy) && (addr->sa_family == AF_INET || addr->sa_family == AF_INET6)) {
                  memset(&copy, 0, sizeof(copy));
                  memcpy(&copy, addr, len);
                  if (addr->sa_family == AF_INET)
                      ((struct sockaddr_in *)&copy)->sin_addr.s_addr = htonl(INADDR_LOOPBACK);
                  else
                      ((struct sockaddr_in6 *)&copy)->sin6_addr = in6addr_loopback;
                  return next_bind(fd, (const struct sockaddr *)&copy, len);
              }
              return next_bind(fd, addr, len);
          }
          """


          def download(url, path, sha=None):
              if not path.exists():
                  tmp = path.with_suffix('.partial')
                  with requests.get(url, stream=True, timeout=120) as r:
                      r.raise_for_status()
                      with tmp.open('wb') as f:
                          for chunk in r.iter_content(1024 * 1024):
                              f.write(chunk)
                  tmp.replace(path)
              digest = hashlib.file_digest(path.open('rb'), 'sha256').hexdigest()
              if sha and digest != sha:
                  raise RuntimeError(f'Checksum mismatch: {path}')
              return digest


          def dataset(cache):
              cache.mkdir(parents=True, exist_ok=True)
              # Resolve once and pin every shard to the same immutable HF revision.
              manifest = cache / 'dataset.json'
              if not manifest.exists():
                  r = requests.get(f'https://huggingface.co/api/datasets/{DATASET}', timeout=120)
                  r.raise_for_status()
                  rev = r.json()['sha']
                  r = requests.get(f'https://huggingface.co/api/datasets/{DATASET}/tree/{rev}?recursive=true', timeout=120)
                  r.raise_for_status()
                  files = [x for x in r.json() if x['path'].endswith('.parquet')]
                  manifest.write_text(json.dumps({'dataset': DATASET, 'revision': rev, 'files': files}, indent=2))
              meta = json.loads(manifest.read_text())
              a = np.empty((100000, 1536), dtype=np.float32)
              offset = 0
              for item in sorted(meta['files'], key=lambda x: x['path']):
                  path = cache / Path(item['path']).name
                  download(f'https://huggingface.co/datasets/{DATASET}/resolve/{meta["revision"]}/{item["path"]}', path, item['lfs']['oid'])
                  parquet = pq.ParquetFile(path)
                  names = [n for n in parquet.schema_arrow.names if 'embedding' in n or n == 'vector']
                  if len(names) != 1:
                      raise RuntimeError(f'Ambiguous vector columns: {parquet.schema_arrow}')
                  # Bound RAM on 7 GiB runners: never create 153 million Python floats.
                  for batch in parquet.iter_batches(batch_size=1024, columns=names):
                      column = batch.column(0)
                      if not np.all(column.value_lengths().to_numpy() == 1536):
                          raise RuntimeError('Wrong vector dimensions')
                      end = offset + batch.num_rows
                      if end > len(a):
                          raise RuntimeError('Too many rows')
                      a[offset:end] = column.flatten().to_numpy().reshape(-1, 1536)
                      offset = end
              if offset != 100000 or not np.isfinite(a).all():
                  raise RuntimeError(f'Unexpected dataset rows/content: {offset}')
              norms = np.linalg.norm(a, axis=1)
              meta['norms'] = {'min': float(norms.min()), 'max': float(norms.max()), 'max_unit_error': float(np.abs(norms - 1).max()), 'unit_tolerance': 0.001}
              if np.any(norms == 0):
                  raise RuntimeError('Zero vector')
              metric = 'ip' if np.allclose(norms, 1, rtol=0, atol=0.001) else 'cosine'
              stream = cache / 'train.ndjson'
              if not stream.exists():
                  tmp = cache / 'train.partial'
                  with tmp.open('w') as f:
                      for i, v in enumerate(a[:99000]):
                          f.write(json.dumps({'id': str(i), 'embedding_v': v.tolist()}, separators=(',', ':'), allow_nan=False) + '\n')
                      f.write('{"_end_":{"commit":{}}}\n')
                  tmp.replace(stream)
              meta['ndjson_sha256'] = hashlib.file_digest(stream.open('rb'), 'sha256').hexdigest()
              return a[99000:].copy(), stream, metric, meta


          def checked(body):
              if isinstance(body, dict):
                  if body.get('error') or body.get('errors') or body.get('total_errors', 0) or body.get('status') == 'error':
                      raise RuntimeError(str(body))
                  for v in body.values():
                      if isinstance(v, (dict, list)):
                          checked(v)
              elif isinstance(body, list):
                  for v in body:
                      checked(v)
              return body


          def variant(args, queries, stream, metric, meta):
              args.output.mkdir(parents=True, exist_ok=True)
              data = args.output.resolve() / 'data'
              if data.exists():
                  raise RuntimeError('Use a fresh output directory; never reuse collection state')
              # Reserve both ports until immediately before starting the owned process.
              sockets = []
              for _ in range(2):
                  s = socket.socket()
                  s.bind(('127.0.0.1', 0))
                  sockets.append(s)
              port, grpc = [s.getsockname()[1] for s in sockets]
              cmd = [str(Path(args.binary).resolve()), '--store.backend=fs', f'--store.data-dir={data}', f'--server.http.port={port}', f'--server.grpc.port={grpc}', f'--server.workers={args.workers}', '--max-ram-mb=4096']
              for s in sockets:
                  s.close()
              session = requests.Session()
              base = f'http://127.0.0.1:{port}'

              def call(path, body=None):
                  r = session.post(base + path, json=body, timeout=7200) if body is not None else session.get(base + path, timeout=120)
                  r.raise_for_status()
                  return checked(r.json())

              def search(codec, v, nprobe=0, exact=False):
                  knn = {'field': 'embedding_v', 'query': v, 'k': 10, 'exact': exact, 'ivf': {'nprobe': nprobe}}
                  return {'query': {'knn': knn}, 'limit': 10, 'fields': ['id']}

              cpu = Path('/proc/cpuinfo').read_text()
              (args.output / 'cpuinfo.txt').write_text(cpu)
              result = {'label': args.label, 'source_revision': args.source_revision, 'binary_sha256': hashlib.file_digest(Path(args.binary).open('rb'), 'sha256').hexdigest(), 'harness_sha256': hashlib.file_digest(Path(__file__).open('rb'), 'sha256').hexdigest(), 'dataset': meta, 'metric': metric, 'index_count': 99000, 'query_count': 1000, 'k': 10, 'workers': args.workers, 'runner': {k: os.getenv(k) for k in ['RUNNER_NAME', 'RUNNER_OS', 'RUNNER_ARCH', 'GITHUB_RUN_ID']}, 'host': platform.uname()._asdict(), 'cpu_model': next((x.split(':', 1)[1].strip() for x in cpu.splitlines() if x.startswith('model name')), platform.machine()), 'simd': {x: x in cpu.lower() for x in ['avx2', 'avx512f', 'neon', 'asimd']}, 'command': cmd, 'rows': []}
              log = (args.output / 'server.log').open('w')
              shim_source = args.output.resolve() / 'loopback-bind.c'
              shim = args.output.resolve() / 'loopback-bind.so'
              shim_source.write_text(LOOPBACK_BIND)
              subprocess.run(['cc', '-shared', '-fPIC', '-O2', str(shim_source), '-ldl', '-o', str(shim)], check=True)
              result['loopback_bind_sha256'] = hashlib.file_digest(shim.open('rb'), 'sha256').hexdigest()
              proc = subprocess.Popen(cmd, stdout=log, stderr=subprocess.STDOUT, env={**os.environ, 'OMP_NUM_THREADS': str(args.workers), 'OPENBLAS_NUM_THREADS': '1', 'LD_PRELOAD': str(shim)})
              try:
                  deadline = time.monotonic() + 120
                  while True:
                      if proc.poll() is not None:
                          raise RuntimeError('Server exited; see server.log')
                      try:
                          call('/collections')
                          break
                      except requests.RequestException:
                          if time.monotonic() > deadline:
                              raise
                          time.sleep(0.2)
                  for codec in [args.variant]:
                      print(f'{codec}: schema/ingest', flush=True)
                      schema = {'fields': {'embedding_v': {'type': 'vector', 'dims': 1536, 'metric': metric, **copy.deepcopy(args.settings)}}}
                      (args.output / f'{codec}-schema.json').write_text(json.dumps(schema, indent=2))
                      call(f'/collections/{codec}/_schema', schema)
                      start = time.perf_counter()
                      with stream.open('rb') as f:
                          r = session.post(base + f'/collections/{codec}/_update', data=f, headers={'Content-Type': 'application/x-ndjson'}, timeout=7200)
                          r.raise_for_status()
                          updates = [checked(json.loads(line)) for line in r.text.splitlines() if line]
                      if not updates:
                          raise RuntimeError('Empty ingest response')
                      visible = call(f'/collections/{codec}/_search', {'query': '*:*', 'limit': 0, 'count_limit': -1})
                      (args.output / f'{codec}-ingest.json').write_text(json.dumps({'updates': updates, 'visible': visible}, indent=2))
                      if visible.get('found') != 99000:
                          raise RuntimeError(f'Expected 99000 visible docs: {visible}')
                      ingest = time.perf_counter() - start
                      print(f'{codec}: ANN build', flush=True)
                      start = time.perf_counter()
                      build = call(f'/collections/{codec}/_update', {'commit': {'build_aux_indexes': ['*'], 'max_segments': 1, 'wait_for_merges': True}})
                      build_s = time.perf_counter() - start
                      stats = call(f'/collections/{codec}/_stats?files=true&segments=true')
                      (args.output / f'{codec}-build.json').write_text(json.dumps({'response': build, 'stats': stats}, indent=2))
                      collections = stats['collections']
                      index = collections[0]['shards'][0]['index']
                      segments = index.get('segments', [])
                      if len(segments) != 1 or int(index['totals']['live_docs']) != 99000:
                          raise RuntimeError(f'Expected one 99k segment: {stats}')
                      overlays = segments[0].get('overlays', [])
                      if not any(x.get('field') == 'embedding_v' and x.get('files') for x in overlays):
                          raise RuntimeError(f'ANN overlay missing; refusing to benchmark exact fallback: {stats}')
                      committed_bytes = int(index['totals']['committed_bytes'])
                      # Persist the entire stats response for independent audit.
                      directory = data / 't' / 't0' / codec
                      files = [x for x in directory.rglob('*') if x.is_file()]
                      size = sum(x.stat().st_size for x in files)
                      allocated = sum(x.stat().st_blocks * 512 for x in files)
                      (args.output / f'{codec}-files.json').write_text(json.dumps({str(x.relative_to(directory)): x.stat().st_size for x in files}, indent=2))
                      print(f'{codec}: exact ground truth', flush=True)
                      vectors = queries.tolist()
                      truth = []
                      for v in vectors:
                          docs = call(f'/collections/{codec}/_search', search(codec, v, exact=True))['docs']
                          ids = {d['id'] for d in docs}
                          if len(ids) != 10:
                              raise RuntimeError('Exact top ten underfilled')
                          truth.append(ids)
                      (args.output / f'{codec}-truth.json').write_text(json.dumps([sorted(x) for x in truth]))
                      # Yield after preparation, then one full pass at a time. The caller
                      # rotates variant order on every pass; all three processes stay alive.
                      yield None
                      all_passes = {n: [] for n in [0, 16, 64]}
                      for nprobe in [0, 16, 64]:
                          payloads = [json.dumps(search(codec, v, nprobe), separators=(',', ':')).encode() for v in vectors]
                          passes = all_passes[nprobe]
                          for pass_no in range(4):
                              times, recalls = [], []
                              for payload, expected in zip(payloads, truth):
                                  start = time.perf_counter_ns()
                                  r = session.post(base + f'/collections/{codec}/_search', data=payload, headers={'Content-Type': 'application/json'}, timeout=120)
                                  elapsed = (time.perf_counter_ns() - start) / 1e6
                                  r.raise_for_status()
                                  ids = {d['id'] for d in checked(r.json())['docs']}
                                  if len(ids) != 10:
                                      raise RuntimeError('ANN top ten underfilled')
                                  times.append(elapsed)
                                  recalls.append(len(ids & expected) / 10)
                              if pass_no:
                                  passes.append({'p50_ms': float(np.percentile(times, 50)), 'p99_ms': float(np.percentile(times, 99)), 'recall_at_10': statistics.mean(recalls), 'latencies_ms': times})
                              print(f'{codec} nprobe={nprobe} pass={pass_no} done', flush=True)
                              if pass_no == 3:
                                  row = {'variant': codec, 'field_settings': args.settings, 'nprobe': 'adaptive' if nprobe == 0 else nprobe, 'ingest_s': ingest, 'ann_build_s': build_s, 'index_bytes': size, 'committed_bytes': committed_bytes, 'allocated_bytes': allocated, **{k: statistics.median(x[k] for x in passes) for k in ['p50_ms', 'p99_ms', 'recall_at_10']}, 'passes': passes}
                                  result['rows'].append(row)
                                  (args.output / 'results.json').write_text(json.dumps(result, indent=2))
                              yield {'variant': codec, 'nprobe': nprobe, 'pass': pass_no}
              finally:
                  proc.terminate()
                  try:
                      proc.wait(timeout=60)
                  except subprocess.TimeoutExpired:
                      proc.kill()
                      proc.wait()
                  log.close()
                  session.close()
                  listeners_closed = {}
                  for listener in [port, grpc]:
                      with socket.socket() as probe:
                          probe.settimeout(1)
                          listeners_closed[str(listener)] = probe.connect_ex(('127.0.0.1', listener)) != 0
                  (args.output / 'shutdown.json').write_text(json.dumps({'exit_code': proc.returncode, 'listeners_closed': listeners_closed}, indent=2))


          def main():
              def interrupted(signum, _frame):
                  raise SystemExit(128 + signum)

              signal.signal(signal.SIGTERM, interrupted)
              p = argparse.ArgumentParser()
              p.add_argument('--base-binary', required=True)
              p.add_argument('--candidate-binary', required=True)
              p.add_argument('--base-revision', required=True)
              p.add_argument('--candidate-revision', required=True)
              p.add_argument('--candidate-field-settings', default='{"ann":{"codec":"pq4"}}', help='JSON merged into candidate vector field; base/default receive none')
              p.add_argument('--cache', type=Path, default=Path('.pq4-dataset'))
              p.add_argument('--output', type=Path, default=Path('pq4-results'))
              p.add_argument('--label', default='local')
              p.add_argument('--workers', type=int, default=2)
              args = p.parse_args()
              settings = json.loads(args.candidate_field_settings)
              if not isinstance(settings, dict) or any(k in settings for k in ['type', 'dims', 'metric']):
                  p.error('Candidate settings must be an object without type/dims/metric overrides')
              args.output.mkdir(parents=True, exist_ok=False)
              queries, stream, metric, meta = dataset(args.cache)
              specs = [('base', args.base_binary, args.base_revision, {}), ('candidate_feature', args.candidate_binary, args.candidate_revision, settings), ('candidate_default', args.candidate_binary, args.candidate_revision, {})]
              schedule = []
              with ExitStack() as stack:
                  generators = []
                  for name, binary, revision, field_settings in specs:
                      config = SimpleNamespace(**{**vars(args), 'variant': name, 'binary': binary, 'source_revision': revision, 'settings': field_settings, 'output': args.output / name})
                      gen = variant(config, queries, stream, metric, meta)
                      stack.callback(gen.close)
                      next(gen)  # prepare collection and exact ground truth
                      generators.append(gen)
                  for turn in range(12):
                      order = list(range(3))
                      order = order[turn % 3:] + order[:turn % 3]
                      for i in order:
                          schedule.append(next(generators[i]))
              results = [json.loads((args.output / name / 'results.json').read_text()) for name, *_ in specs]
              truths = [json.loads((args.output / name / f'{name}-truth.json').read_text()) for name, *_ in specs]
              if any(t != truths[0] for t in truths):
                  raise RuntimeError('Exact ground truth differs between revisions/variants')
              metrics = ['ingest_s', 'ann_build_s', 'index_bytes', 'p50_ms', 'p99_ms', 'recall_at_10']
              rows = []
              for result in results:
                  for row in result['rows']:
                      base = next(r for r in results[0]['rows'] if r['nprobe'] == row['nprobe'])
                      row['delta_percent_vs_base'] = {k: 100 * (row[k] / base[k] - 1) for k in metrics}
                      rows.append(row)
              output = {'label': args.label, 'variants': results, 'rows': rows, 'pass_schedule': schedule, 'exact_truth_equal': True}
              (args.output / 'results.json').write_text(json.dumps(output, indent=2))
              lines = [f'## {args.label}: MAIN vs CANDIDATE', '', f'Base `{args.base_revision}`; candidate `{args.candidate_revision}`.', f'{results[0]["cpu_model"]}; SIMD `{results[0]["simd"]}`; 99k indexed / 1k queries, 1536d, {metric}.', '', 'Each value is followed by percent change vs base; recall delta is relative percent, not percentage points.', '', '| Variant | nprobe | Ingest s (Δ%) | ANN build s (Δ%) | Index MiB (Δ%) | p50 ms (Δ%) | p99 ms (Δ%) | Recall@10 (Δ%) |', '|---|---|---:|---:|---:|---:|---:|---:|']
              for row in rows:
                  values = []
                  for k, digits in zip(metrics, [2, 2, 2, 3, 3, 4]):
                      v = row[k] / 2**20 if k == 'index_bytes' else row[k]
                      values.append(f'{v:.{digits}f} ({row["delta_percent_vs_base"][k]:+.2f}%)')
                  lines.append('| ' + ' | '.join([row['variant'], str(row['nprobe']), *values]) + ' |')
              lines += ['', 'One warm-up and three timed passes per nprobe; variant order rotates every pass. Median of per-pass p50/p99/recall. Ingest/build/size are single measurements in base, feature, default order. Shared-runner ratios carry noise; recall uses identical exact:true ground truth.']
              markdown = '\n'.join(lines) + '\n'
              (args.output / 'summary.md').write_text(markdown)
              if os.getenv('GITHUB_STEP_SUMMARY'):
                  with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                      f.write(markdown)
              print(markdown)


          if __name__ == '__main__':
              main()
          PYTHON_HARNESS
      - name: Compare base, candidate feature and candidate default with interleaved passes
        env:
          CANDIDATE_FIELD_SETTINGS: ${{ inputs.candidate_field_settings || '{}' }}
        run: |
          .bench-venv/bin/python "$RUNNER_TEMP/pq4-bench.py" --base-binary base/build/container-release/bin/luxir --candidate-binary candidate/build/container-release/bin/luxir --base-revision "$(git -C base rev-parse HEAD)" --candidate-revision "$(git -C candidate rev-parse HEAD)" --candidate-field-settings "$CANDIDATE_FIELD_SETTINGS" --label "${{ inputs.runner == 'oven-luxir' && 'Oven' || 'GitHub Actions x86' }} $RUNNER_NAME" --output evidence/benchmark
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
      - name: Save compiler objects even after failure
        if: always() && inputs.runner != 'oven-luxir' && steps.ccache.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/luxir/container-ccache
          key: ${{ steps.ccache.outputs.cache-primary-key }}
      - name: Upload evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pq4-x86-${{ github.run_id }}
          path: |
            evidence/
            !evidence/benchmark/*/data/**
          retention-days: 14
  arm:
    needs: x86
    if: always()
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.candidate_repo }}
          ref: ${{ needs.x86.outputs.source-sha || inputs.candidate_ref }}
          persist-credentials: false
      - name: Record native ARM feasibility (no emulation timings)
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-revision.txt
          lscpu > evidence/lscpu.txt
          ldd --version > evidence/glibc.txt
          cp docs/dev/arm64-build.md docs/dev/container-build.md CMakePresets.json evidence/
          python3 - <<'PY_ARM'
          import json, platform
          from pathlib import Path
          text = Path('docs/dev/arm64-build.md').read_text()
          presets = json.loads(Path('CMakePresets.json').read_text())
          arm = next(x for x in presets['configurePresets'] if x['name'] == 'arm64-release')
          facts = {'status': 'infeasible_with_documented_presets', 'machine': platform.machine(), 'libc': platform.libc_ver(), 'preset': arm, 'reason': 'Documented arm64-release is an x86-host cross build with glibc 2.41 sysroot; Ubuntu 24.04 is glibc 2.39. Container toolchain pins x86 GCC/CMake. No native ARM GCC16/dependency setup is documented at this revision; no emulation numbers reported.'}
          assert '2.41' in text and arm['cacheVariables']['VCPKG_HOST_TRIPLET'].startswith('x64-'), 'Source changed: reassess ARM feasibility'
          Path('evidence/arm-feasibility.json').write_text(json.dumps(facts, indent=2))
          PY_ARM
          cat >> "$GITHUB_STEP_SUMMARY" <<'ARM_SUMMARY'
          ## ARM: blocked by documented toolchain
          The pinned source documents an x86-host cross build with a glibc 2.41 sysroot, incompatible with Ubuntu 24.04's glibc 2.39. Its container pins x86 compiler/CMake archives. Native NEON performance is unmeasured. See the ARM feasibility artifact; this is not a benchmark result.
          ARM_SUMMARY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pq4-arm-feasibility-${{ github.run_id }}
          path: evidence/
          retention-days: 14

# Generated by make-deps-workflow.py; do not edit YAML directly.
name: Luxir dependency image
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Public Luxir source repository
        type: string
        default: luxir-search/luxir
        required: true
      ref:
        description: Source ref (use a full commit SHA for reproducibility)
        type: string
        default: main
        required: true
      runner:
        description: Build runner
        type: choice
        options: [ubuntu-24.04, oven-luxir]
        default: ubuntu-24.04
permissions:
  contents: read
  packages: write
concurrency:
  group: luxir-deps-publisher
  cancel-in-progress: false
jobs:
  deps:
    runs-on: ${{ inputs.runner == 'oven-luxir' && fromJSON('["self-hosted","linux","x64","oven-luxir"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 360
    env:
      DOCKER_CONFIG: /tmp/luxir-deps-docker-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Select Oven rootless Docker endpoint
        if: inputs.runner == 'oven-luxir'
        run: |
          if [[ -z ${DOCKER_HOST:-} && -S /run/user/$(id -u)/docker.sock ]]; then
            echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"
          fi
      - name: Require public source
        env:
          SOURCE_REPO: ${{ inputs.repo }}
        run: |
          curl --fail --silent --show-error "https://api.github.com/repos/$SOURCE_REPO" | python3 -c 'import json,sys; assert json.load(sys.stdin)["private"] is False'
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Write reviewed dependency key helper
        run: |
          cat > "$RUNNER_TEMP/luxir-deps-key.py" <<'DEPS_KEY'
          #!/usr/bin/env python3
          """Hash the effective normal-dependencies build inputs; emit one SHA-256 tag."""
          import hashlib
          import re
          import sys
          from pathlib import Path


          def deps_key(root):
              root = Path(root)
              dockerfile = (root / '.devcontainer/Dockerfile').read_text()
              stage = dockerfile.split('FROM normal-dependencies AS dependencies\n')[0]
              if stage == dockerfile:
                  raise ValueError('Dockerfile stage boundary changed; review deps-key.py')
              copies = re.findall(r'^COPY (.+)$', stage, re.M)
              expected = [
                  '.devcontainer/check-toolchain.cpp .devcontainer/check-toolchain.sh /opt/luxir-checks/',
                  'deps/vcpkg.json deps/vcpkg-configuration.json /opt/luxir-deps/',
                  'deps/ports /opt/luxir-deps/ports',
                  'deps/triplets /opt/luxir-deps/triplets',
                  'test/blas_lapack_test.cpp /opt/luxir-checks/check-lapack.cpp',
              ]
              if 'COPY .devcontainer/check-lapack.cpp /opt/luxir-checks/' in stage:
                  expected[-1] = '.devcontainer/check-lapack.cpp /opt/luxir-checks/'
              if copies != expected or re.search(r'^(ADD|ONBUILD) ', stage, re.M):
                  raise ValueError('Dependency COPY/ADD contract changed; review deps-key.py')
              # BUILD_JOBS controls concurrency, not dependency identity.
              stage = re.sub(r'^ARG BUILD_JOBS=.*$', 'ARG BUILD_JOBS=<concurrency>', stage, flags=re.M)
              ignore = root / '.devcontainer/Dockerfile.dockerignore'
              text = ignore.read_text()
              # hev/luxir@4a27bd8: permit the LAPACK check excluded by upstream test/.
              if 'COPY test/blas_lapack_test.cpp ' in stage and '!test/blas_lapack_test.cpp' not in text.splitlines():
                  text = text.rstrip('\n') + '\n!test/\n!test/blas_lapack_test.cpp\n'
                  ignore.write_text(text)
              files = {'.devcontainer/Dockerfile': stage.encode(),
                       '.devcontainer/Dockerfile.dockerignore': text.encode()}
              for copy in expected:
                  for source in copy.split()[:-1]:
                      path = root / source
                      paths = sorted(path.rglob('*')) if path.is_dir() else [path]
                      for item in paths:
                          if item.is_symlink():
                              raise ValueError(f'Symlink input requires review: {item}')
                          if item.is_file():
                              files[item.relative_to(root).as_posix()] = item.read_bytes()
              digest = hashlib.sha256()
              for name, data in sorted(files.items()):
                  for value in (name.encode(), data):
                      digest.update(len(value).to_bytes(8, 'big'))
                      digest.update(value)
              return digest.hexdigest()


          if __name__ == '__main__':
              print(deps_key(sys.argv[1]))
          DEPS_KEY
      - name: Compute key and skip existing image
        id: deps
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          key=$(python3 "$RUNNER_TEMP/luxir-deps-key.py" .)
          image="ghcr.io/hev/luxir-deps:$key"
          {
            echo "key=$key"
            echo "image=$image"
            echo "jobs=$(./tools/build-jobs 3000)"
          } >> "$GITHUB_OUTPUT"
          if timeout 60 docker manifest inspect "$image" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi
          # shellcheck disable=SC2016
          printf 'Dependency key: `%s`\nSource: `%s`\n' "$key" "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and publish normal dependencies
        if: steps.deps.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.deps.outputs.image }}
          BUILD_JOBS: ${{ steps.deps.outputs.jobs }}
        run: |
          set -euo pipefail
          # Default Docker builder preserves RUN cache mounts on Oven. No GHA layer cache.
          docker build --progress=plain -f .devcontainer/Dockerfile --target normal-dependencies --build-arg "BUILD_JOBS=$BUILD_JOBS" --label org.opencontainers.image.source=https://github.com/hev/luxir -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Record result
        env:
          IMAGE: ${{ steps.deps.outputs.image }}
          EXISTS: ${{ steps.deps.outputs.exists }}
          RUNNER_CHOICE: ${{ inputs.runner }}
        run: |
          # shellcheck disable=SC2016
          printf 'Image: `%s`\nAlready existed: %s\nRunner: %s\n' "$IMAGE" "$EXISTS" "$RUNNER_CHOICE" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"

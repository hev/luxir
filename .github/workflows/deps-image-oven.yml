# Fork-only (hev/luxir): publish a dependency image from the Oven self-hosted
# runner using its warm local Docker build cache. Same key script, Dockerfile
# target and registry as the upstream Dependency image workflow. Not upstream.
name: Dependency image (Oven, fork only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-image-oven
  cancel-in-progress: false

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, oven-luxir]
    timeout-minutes: 240
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}/luxir-deps
      DOCKER_CONFIG: /tmp/deps-docker-oven-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Oven rootless Docker
        run: |
          if [[ -z ${DOCKER_HOST:-} && -S /run/user/$(id -u)/docker.sock ]]; then
            echo "DOCKER_HOST=unix:///run/user/$(id -u)/docker.sock" >> "$GITHUB_ENV"
          fi
      - name: Test key contract
        run: python3 -m unittest discover -s tools/benchmarks -p 'test_deps_key.py'
      - name: Sign in to registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          umask 077
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Compute key and check existing tag
        id: image
        run: |
          set -euo pipefail
          key=$(python3 tools/benchmarks/deps-key.py .)
          image="${REGISTRY,,}:$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          if timeout 60 docker manifest inspect "$image" >/dev/null 2>&1; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          fi
          printf 'Runner: Oven (fork only)\nSource: %s\nDependency image: %s\n' "$(git rev-parse HEAD)" "$image" >> "$GITHUB_STEP_SUMMARY"
      - name: Build and publish normal dependencies
        if: steps.image.outputs.exists != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          docker build --progress=plain -f .devcontainer/Dockerfile \
            --target normal-dependencies --build-arg "BUILD_JOBS=$(./tools/build-jobs 3000)" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Remove registry credentials
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
